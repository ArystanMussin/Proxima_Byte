# Demo config for `pgw simulate` — see README "Быстрый просмотр". Both sources point at the
# built-in simulator (one Modbus device, one OPC UA server), so both protocol drivers get
# exercised end to end without any real hardware.
gateway:
  name: PGW-Demo

sources:
  - name: ctp_12
    driver: modbus_tcp_client
    host: 127.0.0.1
    port: 15020
    unit_id: 1
    scan_rate_ms: 500
    tags:
      - {name: T1_supply, area: HR, address: 100, type: uint16, units: "°C"}
      - {name: P1_supply, area: HR, address: 102, type: uint16, units: "kPa"}
      - {name: setpoint,  area: HR, address: 104, type: uint16, access: RW, units: "°C"}
      - {name: pump1_run, area: DI, address: 0, type: bool}

  - name: plc_opcua
    driver: opcua_client
    endpoint: "opc.tcp://127.0.0.1:4840/pgw/simulator"
    security: {policy: None, mode: None, auth: anonymous, autoaccept: true}
    subscription: {publishing_interval_ms: 300}
    tags:
      - {name: T1_supply, node_id: "ns=1;s=T1_supply", type: float64, units: "°C"}
      - {name: P1_supply, node_id: "ns=1;s=P1_supply", type: float64, units: "kPa"}
      - {name: setpoint,  node_id: "ns=1;s=setpoint",  type: float64, access: RW, units: "°C"}
      - {name: pump1_run, node_id: "ns=1;s=pump1_run", type: bool}

outputs:
  - name: scada_slave
    interface: modbus_tcp_server
    bind: 127.0.0.1
    port: 15021
    read_only: false
    map:
      - {tag: ctp_12.T1_supply, unit_id: 1, area: HR, address: 0, type: uint16}
      - {tag: ctp_12.P1_supply, unit_id: 1, area: HR, address: 2, type: uint16}
      - {tag: ctp_12.setpoint,  unit_id: 1, area: HR, address: 4, type: uint16, rw: true}
      - {tag: ctp_12.pump1_run, unit_id: 1, area: DI, address: 0, type: bool}
      - {tag: plc_opcua.T1_supply, unit_id: 2, area: HR, address: 0, type: float64}
      - {tag: plc_opcua.P1_supply, unit_id: 2, area: HR, address: 4, type: float64}
      - {tag: plc_opcua.setpoint,  unit_id: 2, area: HR, address: 8, type: float64, rw: true}
      - {tag: plc_opcua.pump1_run, unit_id: 2, area: DI, address: 0, type: bool}
