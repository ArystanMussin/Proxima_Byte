name: CI

on:
  push:
    paths: ["pgw/**"]
  pull_request:
    paths: ["pgw/**"]

jobs:
  build-and-test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: pgw
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - run: dotnet restore PGW.sln
      - run: dotnet build PGW.sln --no-restore -c Release
      - run: dotnet test PGW.sln --no-build -c Release

  # Framework-dependent single-file build (needs .NET 8 on the target machine, ~15 MB) — the same
  # package sent ad hoc during development, now produced automatically so it's visible as a build
  # artifact on every push instead of a one-off chat attachment.
  publish-windows:
    needs: build-and-test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pgw
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - run: >
          dotnet publish src/PGW.Host/PGW.Host.csproj -c Release -r win-x64
          --self-contained false -p:PublishSingleFile=true -o pkg/win-x64
      - run: |
          cp deploy/windows/*.bat deploy/windows/README.txt demo/project.yaml pkg/win-x64/
      - uses: actions/upload-artifact@v4
        with:
          name: pgw-windows
          path: pgw/pkg/win-x64/
